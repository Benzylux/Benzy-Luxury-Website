<body>

      <img src="OFF BACK/BLX.png" alt="BLX Logo" class="logo-blx">
    </div>

    <nav>
      <ul class="nav-links">

        <li class="has-dropdown">
          <a href="Shop.html" class="shop-toggle">Shop <span class="chevron">▾</span></a>

            <li><a href="Shop.html?cat=all">All Products</a></li>
