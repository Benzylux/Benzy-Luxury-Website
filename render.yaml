services:
  - type: web
    name: benzy-luxury-backend
    runtime: node
    rootDir: backend/server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: benzy_luxury
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CALLBACK_BASE_URL
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_LIST_NEWSLETTER
        value: 3
      - key: BREVO_LIST_CUSTOMERS
        value: 4
      - key: BREVO_LIST_VIP
        value: 5
      - key: BREVO_LIST_ABANDONED_CART
        value: 6
      - key: BREVO_LIST_GIVEAWAY
        value: 7
      - key: BREVO_LIST_INFLUENCERS
        value: 8
      - key: BREVO_LIST_WHOLESALE
        value: 9
      - key: BREVO_LIST_SUPPORT
        value: 10
      - key: BREVO_LIST_PREORDER
        value: 11
      - key: BREVO_LIST_EVENTS
        value: 12
      - key: BREVO_LIST_WALLET_TOP_UP
        value: 13
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
      - key: BREVO_WEBHOOK_SECRET
        sync: false
      - key: WATI_API_ENDPOINT
        sync: false
      - key: WATI_TOKEN
        sync: false
      - key: WATI_CHANNEL_NUMBER
        sync: false
      - key: WATI_TEMPLATE_NAME
        sync: false
